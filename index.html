<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العداد الدراسي المطور</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121826;
            --card-bg: #1f2937;
            --primary-green: #10b981;
            --primary-orange: #f59e0b;
            --primary-blue: #3b82f6;
            --text-main: #ffffff;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* تنسيق البطاقات */
        .card {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 25px 25px 25px 15px; /* مساحة إضافية لليسار بسبب الدائرة */
            position: relative;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border-bottom: 5px solid transparent;
        }

        .card.green { border-color: var(--primary-green); }
        .card.orange { border-color: var(--primary-orange); }
        .card.blue { border-color: var(--primary-blue); }

        .card-title {
            font-size: 1.1rem;
            color: var(--text-main);
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* الدائرة البيضاء الجانبية */
        .side-circle {
            position: absolute;
            left: -25px;
            top: 50%;
            transform: translateY(-50%);
            background: white;
            color: #121826;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .side-circle .label {
            font-size: 0.75rem;
            font-weight: bold;
            color: #f59e0b;
        }

        .side-circle .val {
            font-size: 1.3rem;
            font-weight: 900;
        }

        /* نظام المربعات الثلاثة - الترتيب المحدث */
        .split-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 10px;
        }

        .split-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 5px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .split-box .unit {
            font-size: 0.85rem;
            color: var(--text-sub);
            font-weight: 400;
        }

        .split-box .number {
            font-size: 2.2rem; /* تكبير الأرقام */
            font-weight: 900;
            line-height: 1;
            margin-bottom: 4px;
        }

        .green .split-box .number { color: var(--primary-green); }
        .orange .split-box .number { color: var(--primary-orange); }

        /* تنسيق البطاقة الوسطى */
        .full-stat {
            font-size: 3.2rem;
            font-weight: 900;
            color: var(--primary-blue);
            margin: 10px 0;
        }

        .sub-text {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        /* التجاوب مع الجوال */
        @media (max-width: 480px) {
            .side-circle {
                width: 65px;
                height: 65px;
                left: -20px;
            }
            .side-circle .val { font-size: 1.1rem; }
            .split-box .number { font-size: 1.8rem; }
            .full-stat { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- البطاقة الأولى: العداد لنهاية العام -->
    <div class="card green" id="card-total">
        <div class="side-circle">
            <span class="label">باقي</span>
            <span class="val" id="circle-total-days">--</span>
        </div>
        <div class="card-title">العداد التنازلي لنهاية العام الدراسي</div>
        <div class="split-grid">
            <!-- اليمين: أيام -->
            <div class="split-box">
                <span class="unit">أيام</span>
                <span class="number" id="total-days-rem">0</span>
            </div>
            <!-- الوسط: أسابيع -->
            <div class="split-box">
                <span class="unit">أسابيع</span>
                <span class="number" id="total-weeks">0</span>
            </div>
            <!-- اليسار: شهور -->
            <div class="split-box">
                <span class="unit">شهور</span>
                <span class="number" id="total-months">0</span>
            </div>
        </div>
    </div>

    <!-- البطاقة الثانية: الأيام المكتملة -->
    <div class="card blue">
        <div class="card-title">الأيام الدراسية المكتملة</div>
        <div class="sub-text">مضى من الدراسة:</div>
        <div class="full-stat" id="completed-days">131 / 180</div>
        <div class="sub-text">يوم دراسي فعلي مر حتى الآن</div>
    </div>

    <!-- البطاقة الثالثة: أيام الدراسة المتبقية -->
    <div class="card orange" id="card-study">
        <div class="side-circle">
            <span class="label">باقي</span>
            <span class="val" id="circle-study-days">--</span>
        </div>
        <div class="card-title">الأيام الدراسية المتبقية</div>
        <div class="split-grid">
            <!-- اليمين: أيام -->
            <div class="split-box">
                <span class="unit">أيام</span>
                <span class="number" id="study-days-rem">0</span>
            </div>
            <!-- الوسط: أسابيع -->
            <div class="split-box">
                <span class="unit">أسابيع</span>
                <span class="number" id="study-weeks">0</span>
            </div>
            <!-- اليسار: شهور -->
            <div class="split-box">
                <span class="unit">شهور</span>
                <span class="number" id="study-months">0</span>
            </div>
        </div>
        <div class="sub-text" style="margin-top: 15px;">عدد الأيام الدراسية المتبقية (بدون إجازات)</div>
    </div>

</div>

<script>
    function calculateTime(totalDays) {
        const months = Math.floor(totalDays / 30);
        const remainingDaysAfterMonths = totalDays % 30;
        const weeks = Math.floor(remainingDaysAfterMonths / 7);
        const days = remainingDaysAfterMonths % 7;
        return { months, weeks, days };
    }

    function updateDashboard() {
        // القيم الحالية بناءً على التاريخ المذكور في النظام
        const totalYearDays = 80;
        const studyDaysRemaining = 49;
        const completed = 131;
        const target = 180;

        // تحديث البطاقة الأولى (نهاية العام)
        document.getElementById('circle-total-days').innerText = totalYearDays;
        const totalTime = calculateTime(totalYearDays);
        document.getElementById('total-months').innerText = totalTime.months;
        document.getElementById('total-weeks').innerText = totalTime.weeks;
        document.getElementById('total-days-rem').innerText = totalTime.days;

        // تحديث البطاقة الثانية (المكتملة)
        document.getElementById('completed-days').innerText = `${completed} / ${target}`;

        // تحديث البطاقة الثالثة (الدراسية المتبقية)
        document.getElementById('circle-study-days').innerText = studyDaysRemaining;
        const studyTime = calculateTime(studyDaysRemaining);
        document.getElementById('study-months').innerText = studyTime.months;
        document.getElementById('study-weeks').innerText = studyTime.weeks;
        document.getElementById('study-days-rem').innerText = studyTime.days;
    }

    window.onload = updateDashboard;
</script>

</body>
</html>
